[project]
name = "hinami"
version = "0.1.0"
description = "AI-assisted daily work journal with organization masters and admin tools"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.141.1",
    "google-auth>=2.56.3",
    "google-cloud-texttospeech>=2.37.0",
    "google-genai>=2.19.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]

[tool.uv]
package = false

# 依存パッケージはTakumi Guard（悪性パッケージを遮断するミラー）経由で取得する。
[[tool.uv.index]]
name = "takumi-guard"
url = "https://pypi.flatt.tech/simple/"
default = true
